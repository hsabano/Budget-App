/* ===== Reusable searchable category picker =====
   Renders a tappable field bound to a hidden <input id="{id}"> so existing save
   logic that reads `.value` keeps working. Tapping opens a search overlay.
   Used everywhere a transaction is categorized (Add Expense, Edit, inline rows). */
function catLabelFor(catId){
  if(!catId||catId==='uncat') return {icon:'❓', text:t('pickCat'), placeholder:true};
  const c=catById(catId);
  if(!c) return {icon:'❓', text:t('pickCat'), placeholder:true};
  const parent=c.parent?catById(c.parent):null;
  return {icon:c.icon, text:parent?`${cname(parent)} › ${cname(c)}`:cname(c), placeholder:false};
}
function catPickerField(id, selectedId, opts={}){
  const lab=catLabelFor(selectedId);
  const cls=opts.compact?'catpick compact':'catpick';
  return `<input type="hidden" id="${id}" value="${selectedId||'uncat'}">
    <button type="button" class="${cls}" data-catpick="${id}">
      <span class="cp-ic">${lab.icon}</span>
      <span class="cp-txt ${lab.placeholder?'cp-ph':''}">${lab.text}</span>
      <span class="cp-chev">${ICON.chevdown}</span>
    </button>`;
}
// Opens the search overlay for a given hidden-input field id. On pick, updates
// the hidden input + the visible field label, runs an optional onPick callback,
// and closes only the overlay (any underlying sheet stays open).
let _catPickTarget=null, _catPickOnPick=null;
function openCatPicker(fieldId, onPick){
  _catPickTarget=fieldId; _catPickOnPick=onPick||null;
  const ov=document.createElement('div');
  ov.id='catpick-ov'; ov.className='catpick-ov';
  ov.innerHTML=`<div class="catpick-sheet">
    <div class="catpick-grab"></div>
    <div class="catpick-search"><span class="cps-ic">${ICON.search||'🔍'}</span>
      <input id="catpick-q" placeholder="${t('searchCat')}" autocomplete="off">
      <button type="button" class="catpick-close" data-catpick-close>✕</button></div>
    <div class="catpick-list" id="catpick-list">${catPickerRows('')}</div>
  </div>`;
  document.body.appendChild(ov);
  const q=document.getElementById('catpick-q');
  const sheet=ov.querySelector('.catpick-sheet');
  const relist=()=>{ document.getElementById('catpick-list').innerHTML=catPickerRows(q.value); bindCatPickRows(); };
  q.oninput=relist;
  ov.querySelector('[data-catpick-close]').onclick=closeCatPicker;
  ov.onclick=(e)=>{ if(e.target===ov) closeCatPicker(); };
  bindCatPickRows();
  // Keep sheet pinned above the keyboard using visualViewport
  const _vpResize=()=>{
    if(!document.getElementById('catpick-ov')) return;
    const vv=window.visualViewport;
    if(!vv) return;
    const avail=vv.height;
    sheet.style.maxHeight=Math.floor(avail*0.82)+'px';
    const offsetFromBottom=window.innerHeight-(vv.offsetTop+vv.height);
    ov.style.transform=`translateY(-${offsetFromBottom}px)`;
  };
  if(window.visualViewport){
    window.visualViewport.addEventListener('resize',_vpResize);
    window.visualViewport.addEventListener('scroll',_vpResize);
    ov._vpResize=_vpResize;
  }
  setTimeout(()=>q.focus(),50);
}
function closeCatPicker(){
  const ov=document.getElementById('catpick-ov');
  if(ov){
    if(ov._vpResize && window.visualViewport){
      window.visualViewport.removeEventListener('resize',ov._vpResize);
      window.visualViewport.removeEventListener('scroll',ov._vpResize);
    }
    ov.remove();
  }
  _catPickTarget=null; _catPickOnPick=null;
}
// Build the filtered, grouped leaf rows. Matches on leaf name, parent name, or
// the combined "Parent › Leaf" path (so "loan" finds "Loans › Home Loan").
function catPickerRows(query){
  const q=(query||'').trim().toLowerCase();
  const leaves=S.cats.filter(isLeaf);
  const rows=leaves.map(c=>{
    const parent=c.parent?catById(c.parent):null;
    const path=parent?`${cname(parent)} › ${cname(c)}`:cname(c);
    return {c, parent, path, hay:(path+' '+cname(c)+(parent?' '+cname(parent):'')).toLowerCase()};
  }).filter(r=>!q||r.hay.includes(q));
  // sort by parent name then leaf
  rows.sort((a,b)=>(a.parent?cname(a.parent):cname(a.c)).localeCompare(b.parent?cname(b.parent):cname(b.c))||cname(a.c).localeCompare(cname(b.c)));
  const cur=_catPickTarget?(document.getElementById(_catPickTarget)||{}).value:null;
  let html='';
  // "Uncategorized" option always available (and when matching the query)
  if(!q || t('uncategorized').toLowerCase().includes(q) || 'uncategorized'.includes(q)){
    html+=`<button type="button" class="cprow ${cur==='uncat'?'sel':''}" data-cppick="uncat">
      <span class="cprow-ic">❓</span><span class="cprow-txt">${t('uncategorized')}</span>
      ${cur==='uncat'?`<span class="cprow-chk">${ICON.check||'✓'}</span>`:''}</button>`;
  }
  html+=rows.map(r=>{
    const parent=r.parent;
    const main=parent?cname(parent):cname(r.c);
    const sub=parent?cname(r.c):'';
    return `<button type="button" class="cprow ${cur===r.c.id?'sel':''}" data-cppick="${r.c.id}">
      <span class="cprow-ic">${r.c.icon}</span>
      <span class="cprow-txt"><b>${main}</b>${sub?`<span class="cprow-sub"> › ${sub}</span>`:''}</span>
      ${cur===r.c.id?`<span class="cprow-chk">${ICON.check||'✓'}</span>`:''}</button>`;
  }).join('');
  if(!html) html=`<div class="cprow-empty">${t('noCatMatch')}</div>`;
  return html;
}
function bindCatPickRows(){
  document.querySelectorAll('#catpick-list [data-cppick]').forEach(el=>el.onclick=()=>{
    const val=el.dataset.cppick, fieldId=_catPickTarget, cb=_catPickOnPick;
    const hidden=document.getElementById(fieldId);
    if(hidden){
      hidden.value=val;
      // update the visible field label
      const field=document.querySelector(`[data-catpick="${fieldId}"]`);
      if(field){const lab=catLabelFor(val);
        field.querySelector('.cp-ic').textContent=lab.icon;
        const txt=field.querySelector('.cp-txt'); txt.textContent=lab.text; txt.classList.toggle('cp-ph',lab.placeholder);}
    }
    closeCatPicker();
    if(cb) cb(val);
  });
}

// Categorization is leaf-only: a category stops being assignable the moment it
// gains a child. Anything still pointing at a now-non-leaf category is moved to
// an auto-created "General" leaf subcategory under that same parent — so it
// stays a valid leaf AND its spend still rolls up into the parent's total.
function ensureGeneralSub(parent){
  let g=childrenOf(parent.id).find(k=>k.general);
  if(!g){
    g={id:uid(), name:{en:'General',ar:'عام'}, icon:parent.icon, budget:0, parent:parent.id, general:true};
    S.cats.push(g);
    markDirty('cats',g.id);
  }
  return g;
}
function reconcileLeafAssignments(){
  let n=0;
  S.tx.forEach(x=>{
    if(x.cat&&x.cat!=='uncat'){
      const c=catById(x.cat);
      if(c&&childrenOf(c.id).length&&!c.general){
        const g=ensureGeneralSub(c);
        if(x.cat!==g.id){ x.cat=g.id; markDirty('txcat',x.id); n++; }
      }
    }
  });
  if(n) save();
  return n;
}
// One-time recovery for the previous version of reconcileLeafAssignments, which
// moved affected transactions to plain "uncat" instead of a General sub. Supabase
// still has the original category_id for those rows (uncat transactions are
// skipped by the push loop), so we read it back and route into the right
// parent's General sub. Only covers transactions that were already synced
// (have sb_tx_id) — manually-added ones with no cloud row can't be recovered
// this way and would need to be re-filed by hand.
async function recoverGeneralAssignments(){
  if(S.settings.recoveredGeneral||!cloudReady||!SB.enabled) return 0;
  const candidates=S.tx.filter(x=>x.cat==='uncat'&&x.sb_tx_id);
  if(!candidates.length){ S.settings.recoveredGeneral=true; saveLocal(); return 0; }
  let rows;
  try{ rows=await sbFetch(`transactions?select=id,category_id&category_id=not.is.null`); }
  catch(e){ return 0; } // network hiccup — try again next boot, don't mark as done
  const map={}; (rows||[]).forEach(r=>{ map[r.id]=r.category_id; });
  let n=0;
  candidates.forEach(x=>{
    const oldCat=map[x.sb_tx_id];
    if(oldCat){
      const p=catById(oldCat);
      if(p&&childrenOf(p.id).length){ x.cat=ensureGeneralSub(p).id; markDirty('txcat',x.id); n++; }
    }
  });
  S.settings.recoveredGeneral=true;
  if(n) save(); else saveLocal();
  return n;
}
function leafReconcileMsg(n){
  return LANG==='ar'
    ? `تم نقل ${n} معاملة إلى فئة فرعية "عام" ضمن فئتها الأصلية لأنها أصبحت تحتوي على فئات فرعية.`
    : `${n} transaction${n===1?' was':'s were'} moved into a "General" subcategory under ${n===1?'its':'their'} original category, since that category now has subcategories.`;
}
function recoverMsg(n){
  return LANG==='ar'
    ? `تمت استعادة تصنيف ${n} معاملة كانت أصبحت "غير مصنّفة" بالخطأ — تم نقلها إلى فئة فرعية "عام".`
    : `Recovered ${n} transaction${n===1?'':'s'} that had been incorrectly moved to Uncategorized — restored into a "General" subcategory.`;
}


// Recovery: a transaction's x.cat is an opaque id pointing at a category.
// If that category definition is gone from S.cats (e.g. erased by a stale
// sync) but x.cat itself was never touched, the transaction still "remembers"
// which group it belonged to — it just has no name/icon/budget anymore.
// This scans for such orphaned ids, groups by id, and lets the user give each
// group a name again. Recreating a category with the SAME id instantly
// relinks every transaction that was pointing at it.
function orphanGroups(){
  const groups={};
  S.tx.forEach(x=>{
    if(x.cat&&x.cat!=='uncat'&&!catById(x.cat)){
      const g=groups[x.cat]=groups[x.cat]||{id:x.cat,count:0,total:0,vendors:[]};
      g.count++; g.total+=Number(x.amount)||0;
      if(x.vendor&&!g.vendors.includes(x.vendor)&&g.vendors.length<4) g.vendors.push(x.vendor);
    }
  });
  return Object.values(groups).sort((a,b)=>b.total-a.total);
}
function recoverySheet(){
  const groups=orphanGroups();
  if(!groups.length){ closeSheet(); toast(LANG==='ar'?'لم يتم العثور على فئات مفقودة 🎉':'No lost categories found 🎉'); return; }
  const parents=topCats();
  openSheet(`<h3>${LANG==='ar'?'استعادة الفئات المفقودة':'Recover lost categories'}</h3>
    <p class="note">${LANG==='ar'
      ?`تم العثور على ${groups.length} مجموعة من المعاملات تشير إلى فئات لم تعد موجودة. أعطِ كل مجموعة اسماً لإعادة ربطها فوراً بنفس المعاملات.`
      :`Found ${groups.length} group${groups.length===1?'':'s'} of transactions pointing at categories that no longer exist. Name each group to relink it to the same transactions instantly.`}</p>
    ${groups.map(g=>`
      <div class="card" style="margin-top:12px;padding:14px">
        <div style="font-weight:700">${g.count} ${LANG==='ar'?'معاملة':('transaction'+(g.count===1?'':'s'))} · SAR ${g.total.toLocaleString()}</div>
        <div class="note" style="margin:4px 0 10px">${g.vendors.join(', ')}${g.vendors.length<g.count?'…':''}</div>
        <label style="font-size:12px">${t('catName')} (EN)</label><input id="ron_${g.id}" placeholder="e.g. Subscriptions">
        <label style="font-size:12px">${t('catName')} (عربي)</label><input id="roa_${g.id}" dir="rtl" placeholder="مثال: الاشتراكات">
        <label style="font-size:12px">${t('parent')}</label>
        <select id="rop_${g.id}"><option value="">${t('none')}</option>
          ${parents.map(p=>`<option value="${p.id}">${p.icon} ${cname(p)}</option>`).join('')}</select>
        <label style="font-size:12px">${t('budgetAmt')} (SAR)</label><input id="rob_${g.id}" type="number" inputmode="decimal" placeholder="0">
        <button class="btn btn-pri" style="margin-top:10px" data-recreate="${g.id}">${LANG==='ar'?'إنشاء وربط':'Create & relink'}</button>
      </div>`).join('')}
  `);
  document.querySelectorAll('[data-recreate]').forEach(btn=>btn.onclick=()=>{
    const gid=btn.dataset.recreate;
    const en=document.getElementById('ron_'+gid).value.trim();
    const ar=document.getElementById('roa_'+gid).value.trim();
    if(!en&&!ar){toast(t('catName'));return;}
    const parent=document.getElementById('rop_'+gid).value||null;
    const budget=parseFloat(document.getElementById('rob_'+gid).value)||0;
    S.cats.push({id:gid, name:{en:en||ar,ar:ar||en}, icon:'📁', parent, budget});
    markDirty('cats',gid);
    save();
    toast(LANG==='ar'?'تم الربط ✅':'Relinked ✅');
    recoverySheet(); // re-render: fewer groups, and this one is now available as a parent
  });
}

function catSheet(editId, presetParent){

  const selParent = c ? c.parent : (presetParent||'');
  // A category that has children is a PARENT and must not hold its own budget —
  // its total rolls up from its children. Hide the budget field in that case.
  const hasKids = editId ? childrenOf(editId).length>0 : false;
  openSheet(`<h3>${editId?t('editCat'):t('addCat')}</h3>
    <label>${t('catName')} (EN)</label><input id="cn_en" value="${c?c.name.en:''}" placeholder="Food">

    ${renderIconPicker(c?c.icon:'🍔')}
    <label>${t('parent')}</label>
    <select id="parent"><option value="">${t('none')}</option>
      ${parents.map(p=>`<option value="${p.id}" ${selParent===p.id?'selected':''}>${p.icon} ${cname(p)}</option>`).join('')}</select>
    ${hasKids
      ? `<div class="rollupnote">${LANG==='ar'?'هذه فئة رئيسية — تُحتسب ميزانيتها تلقائياً من فئاتها الفرعية.':'This is a parent category — its budget is the sum of its sub-categories.'}</div>`
      : `<label>${t('budgetAmt')} (SAR)</label><input id="cbud" type="number" inputmode="decimal" value="${c?c.budget||'':''}" placeholder="0">`}
    <button class="btn btn-pri" id="savecat">${t('save')}</button>
    ${editId?`<button class="btn btn-bad" id="delcat">${t('delete')}</button>`:''}`);
  let picked=c?c.icon:'🍔';
  document.querySelectorAll('#emo span[data-e]').forEach(s=>s.onclick=()=>{
    document.querySelectorAll('#emo span[data-e]').forEach(x=>x.classList.remove('on'));
    s.classList.add('on');picked=s.dataset.e;
    const ci=document.getElementById('customicon');if(ci)ci.value='';
  });
  const ci=document.getElementById('customicon');
  if(ci)ci.oninput=()=>{
    const v=ci.value.trim();
    if(v){picked=v;document.querySelectorAll('#emo span[data-e]').forEach(x=>x.classList.remove('on'));}
  };
  const isr=document.getElementById('iconsearch');
  if(isr)isr.oninput=()=>{
    const q=isr.value.trim().toLowerCase();
    document.querySelectorAll('#emo span[data-e]').forEach(s=>s.classList.toggle('hide',!!q&&!s.dataset.kw.includes(q)));
    document.querySelectorAll('#emo .grp').forEach(g=>{
      let el=g.nextElementSibling,any=false;
      while(el&&!el.classList.contains('grp')){if(!el.classList.contains('hide'))any=true;el=el.nextElementSibling;}
      g.classList.toggle('hide',!!q&&!any);
    });
  };
  document.getElementById('savecat').onclick=()=>{
    const en=document.getElementById('cn_en').value.trim(),ar=document.getElementById('cn_ar').value.trim();
    if(!en&&!ar){toast(t('catName'));return;}
    const budEl=document.getElementById('cbud');
    const data={name:{en:en||ar,ar:ar||en},icon:picked,
      parent:document.getElementById('parent').value||null,budget:budEl?(parseFloat(budEl.value)||0):(c?c.budget||0:0)};
    let savedId;
    if(editId){Object.assign(c,data);savedId=editId;}else{savedId=uid();S.cats.push({id:savedId,...data});}
    markDirty('cats',savedId);
    const moved=reconcileLeafAssignments();
    // A parent that just gained a child must drop its own budget (rolls up from children).
    if(enforceParentBudgets()){ topCats().forEach(p=>{ if(childrenOf(p.id).length) markDirty('cats',p.id); }); }
    save();closeSheet();render();
    toast(moved?leafReconcileMsg(moved):t('savedCat'));
  };
  if(editId)document.getElementById('delcat').onclick=()=>{
    const kidIds=childrenOf(editId).map(k=>k.id);
    const ids=[editId,...kidIds];
    const affected=S.tx.filter(x=>ids.includes(x.cat));
    const n=affected.length, m=kidIds.length;
    const c=catById(editId);
    closeSheet();
    const msg = LANG==='ar'
      ? `${n} معاملة مرتبطة بهذه الفئة${m?` وفئاتها الفرعية (${m})`:''}. ستصبح غير مصنّفة. لا يمكن التراجع.`
      : `${n} transaction${n===1?' is':'s are'} mapped to this category${m?` and its ${m} subcategor${m===1?'y':'ies'}`:''}. They will become Uncategorized. This cannot be undone.`;
    confirmSheet((LANG==='ar'?'حذف ':'Delete ')+(c?cname(c):'')+'?', msg, async ()=>{
      S.cats=S.cats.filter(x=>x.id!==editId&&x.parent!==editId);
      S.dirty.cats=S.dirty.cats.filter(id=>!ids.includes(id)); // don't resurrect a deleted category
      affected.forEach(x=>{ x.cat='uncat'; markDirty('txcat',x.id); });
      const vendorsToUnmap=Object.keys(S.vendorMap||{}).filter(v=>ids.includes(S.vendorMap[v]));
      vendorsToUnmap.forEach(v=>delete S.vendorMap[v]);
      // Push is upsert-only now, so the category rows themselves and any
      // orphaned vendor mappings must be deleted explicitly. Clearing
      // category_id on affected transactions is handled by the dirty push above.
      if(SB.enabled&&SB.url&&SB.anonKey){
        for(const cid of ids){ try{ await sbDelete(`categories?id=eq.${cid}`); }catch(e){} }
        for(const v of vendorsToUnmap){ try{ await sbDelete(`vendor_map?vendor=eq.${encodeURIComponent(v)}`); }catch(e){} }
      }
      drillCat=null; save(); render();
      toast(LANG==='ar'?'تم حذف الفئة':'Category deleted');
    });
  };
}

async function purgeSupabaseTx(){
  // Delete rows from Supabase transactions table so they don't re-import on next poll.
  if(!SB.enabled||!SB.url||!SB.anonKey) return;
  try{
    await fetch(`${SB.url}/rest/v1/transactions?id=gt.0`,{method:'DELETE',
      headers:{'apikey':SB.anonKey,'Authorization':`Bearer ${authToken()}`,'Prefer':'return=minimal'}});
  }catch(e){ console.warn('purge error',e); }
}

let XLSXP=null;
function loadXLSX(){
  if(window.XLSX) return Promise.resolve(window.XLSX);
  if(XLSXP) return XLSXP;
  XLSXP=new Promise((res,rej)=>{const sc=document.createElement('script');
    sc.src='https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js';
    sc.onload=()=>res(window.XLSX);
    sc.onerror=()=>{XLSXP=null;rej(new Error(LANG==='ar'?'تعذر تحميل مكتبة Excel — تحقق من الاتصال':'Could not load Excel library — check connection'));};
    document.head.appendChild(sc);});
  return XLSXP;
}
// Pure row processor: finds or creates categories, sets budgets. Returns counts.
function processBudgetRows(rows){
  const norm=s=>String(s??'').trim();
  const low=s=>norm(s).toLowerCase();
  // Header matching is lenient: case, spacing, and punctuation don't matter, so
  // "Budget (SAR)", "budget(sar)", " Budget (SAR) ", "budget_sar" all match the
  // same alias. Built once from the first row's keys (sheet_to_json with
  // defval:'' guarantees every row shares the same key set).
  const normKey=s=>String(s).toLowerCase().replace(/[^a-z0-9\u0600-\u06FF]/g,'');
  const keyMap={};
  if(rows[0]) for(const k of Object.keys(rows[0])) keyMap[normKey(k)]=k;
  const pick=(r,aliases)=>{
    for(const a of aliases){
      const actual=keyMap[normKey(a)];
      if(actual!==undefined && r[actual]!==undefined && norm(r[actual])!=='') return norm(r[actual]);
    }
    return '';
  };
  // Parses a budget cell that may contain Arabic-Indic digits (١٢٣), Arabic
  // thousands/decimal separators (٬ ٫), currency words (SAR / ريال / ر.س / $),
  // EN-style thousands commas (1,500), or European format (1.500,00).
  const parseAmt=raw=>{
    let s=String(raw??'').trim();
    if(!s) return 0;
    s=s.replace(/[\u0660-\u0669]/g,d=>String(d.charCodeAt(0)-0x0660))   // Arabic-Indic digits -> 0-9
       .replace(/[\u06F0-\u06F9]/g,d=>String(d.charCodeAt(0)-0x06F0));  // Persian digits -> 0-9
    s=s.replace(/\u066B/g,'.').replace(/\u066C/g,'');                   // Arabic decimal/thousands seps
    s=s.replace(/ر\.?\s?س\.?|ريال|﷼|SAR|SR\b|USD|AED/gi,'').trim();       // currency words/symbols
    if(/^-?\d{1,3}(\.\d{3})+,\d+$/.test(s)) s=s.replace(/\./g,'').replace(',','.'); // 1.500,00 -> 1500.00
    else s=s.replace(/,/g,'');                                          // 1,500 -> 1500
    s=s.replace(/[^0-9.\-]/g,'');                                        // strip anything left over
    const n=parseFloat(s);
    return isNaN(n)?0:n;
  };
  const findCat=(name,parentId)=>{const nm=low(name);if(!nm)return null;
    return S.cats.find(c=>(c.parent||null)===(parentId||null)&&(low(c.name.en)===nm||low(c.name.ar)===nm));};
  let created=0,updated=0,skipped=0;
  for(const r of rows){
    const mainEn=pick(r,['Main Category (EN)','Main Category','Category (EN)','Category','main_en']);
    const mainAr=pick(r,['Main Category (AR)','الفئة الرئيسية','main_ar']);
    const subEn=pick(r,['Subcategory (EN)','Subcategory','sub_en']);
    const subAr=pick(r,['Subcategory (AR)','الفئة الفرعية','sub_ar']);
    const icon=pick(r,['Icon','أيقونة','icon']);
    const budget=parseAmt(pick(r,['Budget (SAR)','Budget','Amount (SAR)','Amount','الميزانية','budget']));
    if(!mainEn&&!mainAr){skipped++;continue;}
    let main=findCat(mainEn,null)||findCat(mainAr,null);
    let mainCreated=false;
    if(!main){
      main={id:uid(),name:{en:mainEn||mainAr,ar:mainAr||mainEn},icon:(!subEn&&!subAr&&icon)?icon:'📁',budget:0,parent:null};
      S.cats.push(main);created++;mainCreated=true;markDirty('cats',main.id);
    }
    if(subEn||subAr){
      let sub=findCat(subEn,main.id)||findCat(subAr,main.id);
      if(!sub){sub={id:uid(),name:{en:subEn||subAr,ar:subAr||subEn},icon:icon||'📁',budget,parent:main.id};S.cats.push(sub);created++;markDirty('cats',sub.id);}
      else{sub.budget=budget;if(icon)sub.icon=icon;if(subEn)sub.name.en=subEn;if(subAr)sub.name.ar=subAr;updated++;markDirty('cats',sub.id);}
    }else{
      main.budget=budget;
      if(icon)main.icon=icon;
      if(mainEn)main.name.en=mainEn; if(mainAr)main.name.ar=mainAr;
      if(!mainCreated){updated++;markDirty('cats',main.id);}
    }
  }
  return {created,updated,skipped};
}
async function handleBudgetUpload(file){
  try{
    const XLSX=await loadXLSX();
    const buf=await file.arrayBuffer();
    const wb=XLSX.read(buf,{type:'array'});
    const rows=XLSX.utils.sheet_to_json(wb.Sheets[wb.SheetNames[0]],{defval:''});
    if(!rows.length){toast(LANG==='ar'?'الملف فارغ':'File is empty');return;}
    const res=processBudgetRows(rows);
    // Any parent that ended up with children must drop its own budget.
    if(enforceParentBudgets()){ topCats().forEach(p=>{ if(childrenOf(p.id).length) markDirty('cats',p.id); }); }
    save();render();
    toast(`✅ ${res.created} ${LANG==='ar'?'أُضيفت':'created'} · ${res.updated} ${LANG==='ar'?'حُدّثت':'updated'}${res.skipped?` · ${res.skipped} ${LANG==='ar'?'تُخطيت':'skipped'}`:''}`);
  }catch(e){toast('❌ '+(e&&e.message?e.message:'Upload failed'));}
}

/* ===== Budget vs actual export ===== */
function exportBudgetCSV(){
  const list=txInPeriod(); const [ps,pe]=periodRange();
  const d=dt=>dt.toISOString().slice(0,10);
  const q=s=>'"'+String(s??'').replace(/"/g,'""')+'"';
  let csv='\uFEFFPeriod Start,Period End,Level,Main Category,Subcategory,Icon,Budget (SAR),Actual Spend (SAR),Remaining (SAR),% Used,Transactions,Status\n';
  topCats().forEach(c=>{
    const kids=childrenOf(c.id);
    const b=catBudget(c), s=catSpent(c.id,list);
    const ids=[c.id,...kids.map(k=>k.id)];
    const n=list.filter(x=>ids.includes(x.cat)).length;
    csv+=[d(ps),d(pe),'Main',q(cname(c)),'',q(c.icon),b,s.toFixed(2),(b-s).toFixed(2),b>0?Math.round(s/b*100)+'%':'',n,statusOf(s,b)].join(',')+'\n';
    kids.forEach(k=>{
      const kb=k.budget||0, ks=catSpent(k.id,list);
      const kn=list.filter(x=>x.cat===k.id).length;
      csv+=[d(ps),d(pe),'Sub',q(cname(c)),q(cname(k)),q(k.icon),kb,ks.toFixed(2),(kb-ks).toFixed(2),kb>0?Math.round(ks/kb*100)+'%':'',kn,statusOf(ks,kb)].join(',')+'\n';
    });
  });
  const blob=new Blob([csv],{type:'text/csv;charset=utf-8'});const url=URL.createObjectURL(blob);
  const a=document.createElement('a');a.href=url;a.download='awzin-budget-vs-actual.csv';a.click();URL.revokeObjectURL(url);
  toast(t('exportData'));
}

/* ============ INBOUND FROM iOS SHORTCUT ============ */
// Shortcut opens: index.html?sms=<encoded message text>
function handleInbound(){
  try{
    const params=new URLSearchParams(location.search);
    const raw=params.get('sms');
    if(raw&&raw.trim()){
      const txt=decodeURIComponent(raw);
      const p=parseSMS(txt);
      history.replaceState({},'',location.pathname);
      if(p.ignore||p.amount===null||p.amount===0){ render(); setTimeout(()=>toast(LANG==='ar'?'تم تجاهل رسالة غير مالية':'Ignored a non-transaction message'),200); return true; }
      if(p.flow==='in'){
        const incId=uid();
        S.income.push({id:incId,amount:p.amount,source:p.from||p.vendor||'Deposit',date:p.date,kind:p.kind});
        markDirty('income',incId);
        save();render();setTimeout(()=>toast(LANG==='ar'?'تمت إضافة الدخل':'Income added'),200);return true;
      }
      const sug=suggestCat(p.vendor);
      render();
      setTimeout(()=>{
        expenseSheet({amount:p.amount,vendor:p.vendor,card:p.card,date:p.date,cat:sug||'uncat'});
        toast(t('detected'));
      },150);
      return true;
    }
  }catch(e){}
  return false;
}

// Boot: handle auth first, then load data
(async function boot(){
  // No Supabase config yet → show login (which will prompt for config)
  if(!SB.url||!SB.anonKey){ loginScreen(); return; }
  // Have a session? Refresh if near expiry, then load
  if(isLoggedIn()){
    if(AUTH.expires_at && Date.now() > AUTH.expires_at - 60000){
      const ok=await refreshSession();
      if(!ok){ saveAuth(null); loginScreen(); return; }
    }
    if(!handleInbound()){
      await loadFromCloud();
      const recovered=await recoverGeneralAssignments();
      const moved=reconcileLeafAssignments();
      render();
      if(recovered) toast(recoverMsg(recovered));
      else if(moved) toast(leafReconcileMsg(moved));
    }
    startPolling();
  } else {
    loginScreen();
  }
})();
